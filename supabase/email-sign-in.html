<!-- CurioUS sign-in email. Paste into Supabase > Authentication > Emails > Templates > Magic Link.
     Subject: Your CurioUS code: {{ .Token }} -->
<div style="background:#f2f2f0;padding:32px 16px;font-family:Helvetica,Arial,sans-serif;color:#000">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;margin:0 auto;background:#ffffff;border-radius:20px">
    <tr>
      <td style="padding:28px 28px 0;font-size:26px;letter-spacing:-1px">curio<b>US</b></td>
    </tr>
    <tr>
      <td style="padding:20px 28px 8px">
        <h1 style="margin:0 0 10px;font-size:24px;line-height:1.15;letter-spacing:-0.5px">Your rabbit holes are waiting.</h1>
        <p style="margin:0;font-size:16px;line-height:1.5;color:#2b2b2a">Type this code into CurioUS, or tap the button below.</p>
        <p style="margin:18px 0 0;font-size:34px;font-weight:bold;letter-spacing:8px">{{ .Token }}</p>
      </td>
    </tr>
    <tr>
      <td style="padding:20px 28px">
        <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#000;color:#fff;text-decoration:none;font-weight:bold;font-size:16px;padding:14px 22px;border-radius:12px">Sign in to CurioUS</a>
      </td>
    </tr>
    <tr>
      <td style="padding:0 28px 28px;font-size:13px;line-height:1.5;color:#6e6e6b">
        The code and link work once and expire in an hour. If you didn't ask for it, you can ignore this email.<br /><br />
        CurioUS, the feed you steer. <a href="https://www.swipecurious.com" style="color:#6e6e6b">swipecurious.com</a>
      </td>
    </tr>
  </table>
</div>
